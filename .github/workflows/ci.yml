name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 源码语法可解析
      - run: node --check command_panel.js
      - run: node --check tools/build-bundle.mjs
      # 两个脚本包与源码一致（改了 command_panel.js 忘了重新打包会在这里拦下）
      - run: node tools/build-bundle.mjs --check
